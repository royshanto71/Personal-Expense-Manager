{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Budget Form{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="glass-card">
      <h4 class="mb-4">{% if form.instance.pk %}Edit{% else %}Set{% endif %} Budget</h4>
      
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Save Budget</button>
            <a href="{% url 'budget-list' %}" class="btn btn-glass text-decoration-none text-center">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
