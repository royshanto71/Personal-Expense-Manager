{% extends 'base.html' %}

{% block title %}Reports & Analytics{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Reports</h2>
    <a href="{% url 'export-csv' %}" class="btn btn-outline-light"><i class="bi bi-download me-2"></i> Export CSV</a>
</div>

<div class="row">
    <div class="col-lg-8 mb-4">
        <div class="glass-card mb-4">
            <h5 class="fw-bold mb-3">Spending Heatmap (2024)</h5>
            <div id="calendar-heatmap" style="overflow-x: auto;">
                <!-- Heatmap grid generated by JS -->
                <div class="heatmap-grid d-flex flex-wrap gap-1" style="width: 100%; min-width: 600px;">
                    <!-- JS injects here -->
                </div>
            </div>
            <div class="d-flex justify-content-end mt-2">
                <small class="text-secondary d-flex align-items-center gap-2">
                    Less <span class="d-inline-block rounded-1" style="width:10px; height:10px; background: rgba(255,255,255,0.1)"></span>
                    <span class="d-inline-block rounded-1" style="width:10px; height:10px; background: rgba(139, 92, 246, 0.4)"></span>
                    <span class="d-inline-block rounded-1" style="width:10px; height:10px; background: rgba(139, 92, 246, 0.8)"></span> More
                </small>
            </div>
        </div>
        
        <div class="glass-card">
            <h5 class="fw-bold mb-3">Monthly Spending</h5>
            <canvas id="monthlyChart" height="250"></canvas>
        </div>
    </div>
    
    <div class="col-lg-4">
        <div class="glass-card mb-4">
            <h5 class="fw-bold mb-3">Insights</h5>
            <div class="alert bg-glass border-0 text-white mb-3">
                <i class="bi bi-lightbulb-fill text-warning me-2"></i>
                Spending is <strong>12% lower</strong> than last month. Good job!
            </div>
             <div class="alert bg-glass border-0 text-white mb-3">
                <i class="bi bi-graph-up-arrow text-danger me-2"></i>
                Highest spending category: <strong>Food</strong>.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Monthly Chart
    new Chart(document.getElementById('monthlyChart'), {
        type: 'bar',
        data: {
            labels: {{ monthly_labels|safe }},
            datasets: [{
                label: 'Total Spent',
                data: {{ monthly_data|safe }},
                backgroundColor: '#8b5cf6',
                borderRadius: 4
            }]
        },
        options: {
            scales: {
                y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#94a3b8' } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
            },
            plugins: { legend: { display: false } }
        }
    });

    // Simple Heatmap Logic
    const heatmapData = {{ heatmap_data|safe }};
    const container = document.querySelector('.heatmap-grid');
    const today = new Date();
    const yearStart = new Date(today.getFullYear(), 0, 1);
    
    // Generate 365 days
    for (let i = 0; i < 365; i++) {
        const d = new Date(yearStart);
        d.setDate(d.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const val = heatmapData[dateStr] || 0;
        
        const el = document.createElement('div');
        el.style.width = '12px';
        el.style.height = '12px';
        el.style.borderRadius = '2px';
        el.title = `${dateStr}: $${val}`;
        
        // Color based on value
        if (val === 0) el.style.backgroundColor = 'rgba(255,255,255,0.05)';
        else if (val < 50) el.style.backgroundColor = 'rgba(139, 92, 246, 0.2)';
        else if (val < 100) el.style.backgroundColor = 'rgba(139, 92, 246, 0.4)';
        else if (val < 200) el.style.backgroundColor = 'rgba(139, 92, 246, 0.6)';
        else el.style.backgroundColor = 'rgba(139, 92, 246, 0.9)';
        
        container.appendChild(el);
    }
</script>
{% endblock %}
