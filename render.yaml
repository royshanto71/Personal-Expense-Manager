# FinanceFlow - Django Expense Manager
# https://render.com/docs/deploy-django

services:
  # Web Service
  - type: web
    name: financeflow
    runtime: python
    region: oregon  # or choose: ohio, frankfurt, singapore
    plan: free  # or: starter, standard, pro
    buildCommand: "./build.sh"
    startCommand: "gunicorn expense_manager.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: financeflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"

# Optional: PostgreSQL Database
databases:
  - name: financeflow-db
    plan: free  # or: starter, basic, standard, pro
    region: oregon
    databaseName: financeflow
    user: financeflow
